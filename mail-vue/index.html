<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#101a24" id="theme-color-meta">
  <meta name="description" content="g3rry.com / Mail — personal correspondence.">
  <title>g3rry. / Mail</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    // Match the store default, while retaining an explicitly saved light choice.
    let dark = true;
    try {
      const saved = JSON.parse(localStorage.getItem('ui') || 'null');
      if (typeof saved?.dark === 'boolean') dark = saved.dark;
    } catch { /* An invalid old preference should not block the login screen. */ }
    document.documentElement.classList.toggle('dark', dark);
    document.getElementById('theme-color-meta').setAttribute('content', dark ? '#101a24' : '#eee9df');
  </script>
</head>
<style>
  html {
    background: #eee9df;
  }
  .dark {
    background: #101a24;
  }
  #loading-first {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: var(--el-bg-color, #eee9df);
  }
  .dark #loading-first { background: var(--el-bg-color, #101a24); }

  .loading-hide {
    pointer-events: none;
    transition: all 200ms;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  .circular {
    height: 30px;
    width: 30px;
    animation: loading-rotate 1s linear infinite;
  }

  .loading-path .dot1 {
    transform: translate(3.75px, 3.75px);
    fill: #c9af77;
    animation: custom-spin-move 1s infinite linear alternate;
    opacity: 0.3;
  }

  .loading-path .dot2 {
    transform: translate(calc(100% - 3.75px), 3.75px);
    fill: #c9af77;
    animation: custom-spin-move 1s infinite linear alternate;
    opacity: 0.3;
    animation-delay: 0.4s;
  }

  .loading-path .dot3 {
    transform: translate(3.75px, calc(100% - 3.75px));
    fill: #c9af77;
    animation: custom-spin-move 1s infinite linear alternate;
    opacity: 0.3;
    animation-delay: 1.2s;
  }

  .loading-path .dot4 {
    transform: translate(calc(100% - 3.75px), calc(100% - 3.75px));
    fill: #c9af77;
    animation: custom-spin-move 1s infinite linear alternate;
    opacity: 0.3;
    animation-delay: 0.8s;
  }

  @keyframes loading-rotate {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes custom-spin-move {
    to {
      opacity: 1;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .circular, .loading-path circle { animation: none; opacity: 1; }
  }
</style>
<body>
<div id="loading-first" >
  <div class="loading-icon">
    <svg class="circular" viewBox="0 0 20 20">
      <g class="loading-path">
        <circle r="3.375" class="dot1" rx="0" ry="0"/>
        <circle r="3.375" class="dot2" rx="0" ry="0"/>
        <circle r="3.375" class="dot4" rx="0" ry="0"/>
        <circle r="3.375" class="dot3" rx="0" ry="0"/>
      </g>
    </svg>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
